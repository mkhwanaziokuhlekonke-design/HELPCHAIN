kind = "mobile"
previewPath = "/"
title = "HelpChain"
version = "1.0.0"
id = "artifacts/helpchain"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24776

[services.development]
run = "pnpm --filter @workspace/helpchain run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/helpchain", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/helpchain", "run", "serve" ]

[services.env]
PORT = "24776"
BASE_PATH = "/"
